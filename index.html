<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emotreeW</title>
  <style>
    :root {
      --green: #1f7a4c;
      --green-dark: #165c39;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #e6e6e6;
      --chip: #eef6f1;
      --nav-h: 56px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      line-height: 1.65;
      background: #fff;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--nav-h);
      background: var(--green);
      color: #fff;
    }
    .nav-inner {
      max-width: 960px;
      height: 100%;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
    }
    .brand {
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .nav-links {
      display: flex;
      gap: 1.1rem;
      font-size: 0.95rem;
    }
    .nav-links a:hover { text-decoration: underline; }

    main { max-width: 960px; margin: 0 auto; padding: 0 1.25rem 4rem; }

    section {
      scroll-margin-top: var(--nav-h);
      padding-top: 2rem;
    }
    section h2 {
      font-size: 1.15rem;
      margin: 0 0 0.85rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--line);
    }

    .hero {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 2.25rem;
      align-items: start;
      padding-top: 2.25rem;
      padding-bottom: 1.5rem;
    }

    .photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #dfe7e2;
      border: 1px dashed var(--green);
      display: grid;
      place-items: center;
      color: var(--green-dark);
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0.9rem 0 0;
      padding: 0;
      list-style: none;
    }
    .keywords li {
      background: var(--chip);
      color: var(--green-dark);
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .bio h1 {
      margin: 0 0 0.75rem;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
    }
    .bio p { margin: 0 0 1rem; color: var(--muted); }
    .bio p strong { color: var(--ink); font-weight: 600; }

    .placeholder {
      color: var(--muted);
      background: #fafafa;
      border: 1px solid var(--line);
      padding: 1rem 1.1rem;
    }

    @media (max-width: 720px) {
      .nav-links { gap: 0.7rem; font-size: 0.85rem; }
      .hero {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
      .photo { max-width: 220px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#home">emotreeW</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="#home">Home</a>
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#cv">CV</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div>
        <div class="photo">Photo<br>待替换</div>
        <ul class="keywords">
          <li>关键词一</li>
          <li>关键词二</li>
          <li>关键词三</li>
        </ul>
      </div>
      <div class="bio">
        <h1>emotreeW</h1>
        <p><strong>身份。</strong>待补充：你是谁、现在在哪、在做什么。</p>
        <p><strong>研究方向。</strong>待补充：一两句说清你做的问题和感兴趣的方向。</p>
        <p><strong>兴趣爱好。</strong>待补充：研究之外的事，写一两句即可。</p>
      </div>
    </section>

    <section id="research">
      <h2>Research</h2>
      <div class="placeholder">项目与研究方向待补充。</div>
    </section>

    <section id="publications">
      <h2>Publications</h2>
      <div class="placeholder">论文列表待补充。</div>
    </section>

    <section id="cv">
      <h2>CV</h2>
      <div class="placeholder">简历 PDF 待上传。</div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <div class="placeholder">邮箱与链接待补充。</div>
    </section>
  </main>
</body>
</html>
